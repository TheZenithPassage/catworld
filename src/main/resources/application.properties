spring.application.name=catworld
catworld.security.username=${CATWORLD_SECURITY_USERNAME}
catworld.security.password=${CATWORLD_SECURITY_PASSWORD}
catworld.security.cors-allowed-origins=${CATWORLD_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:4200}
spring.servlet.multipart.max-file-size=32MB
spring.servlet.multipart.max-request-size=33MB
# Bind local dates and times as Java time values, without a JDBC time-zone conversion.
spring.jpa.properties.hibernate.type.java_time_use_direct_jdbc=true
