map $http_authorization $catworld_authorization {
    include /etc/nginx/catworld-authorization.conf;
}

map $request_method $demo_read_client {
    ~^(GET|HEAD|OPTIONS)$ $binary_remote_addr;
    default "";
}

map $request_method $demo_write_client {
    ~^(GET|HEAD|OPTIONS)$ "";
    default $binary_remote_addr;
}

map $request_method $demo_read_total {
    ~^(GET|HEAD|OPTIONS)$ demo;
    default "";
}

map $request_method $demo_write_total {
    ~^(GET|HEAD|OPTIONS)$ "";
    default demo;
}

limit_req_zone $demo_read_client zone=demo_read_client:1m rate=10r/s;
limit_req_zone $demo_read_total zone=demo_read_total:1m rate=30r/s;
limit_req_zone $demo_write_client zone=demo_write_client:1m rate=30r/m;
limit_req_zone $demo_write_total zone=demo_write_total:1m rate=120r/m;

# Port 80 is reachable only inside the demo's Docker networks. The public
# ingress connector supplies CF-Connecting-IP on this listener.
server {
    listen 80;
    server_name _;
    client_max_body_size 8m;
    include /etc/nginx/nginx-demo-real-ip.conf;

    include /etc/nginx/nginx-server.conf;
}

# The Windows port is mapped here, where client-supplied forwarding headers
# are ignored for rate limits and daily reset allowances.
server {
    listen 8081;
    server_name _;
    client_max_body_size 8m;

    include /etc/nginx/nginx-server.conf;
}
