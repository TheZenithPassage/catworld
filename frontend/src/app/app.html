@if (authenticated()) {
  <mat-toolbar class="app-header" [class.app-header--calendar-route]="calendarRoute()">
    <h1>
      <a mat-button routerLink="/" class="app-brand">
        <span class="app-brand-logo">
          <img src="/catworld-logo.png" [alt]="text().app.brand" />
        </span>
      </a>
    </h1>

    <nav class="app-nav" [attr.aria-label]="text().app.navigationLabel">
      @for (item of navigationItems(); track item.path) {
        <a
          mat-button
          [routerLink]="item.path"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: item.exact }"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <button
      mat-icon-button
      type="button"
      class="nav-menu-button"
      [matMenuTriggerFor]="navigationMenu"
      [attr.aria-label]="text().app.navigationMenuLabel"
    >
      <span aria-hidden="true" class="app-menu-icon">
        <svg viewBox="0 0 24 24" focusable="false">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </span>
    </button>

    <mat-menu #navigationMenu="matMenu" class="app-navigation-menu">
      @for (item of navigationItems(); track item.path) {
        <a
          mat-menu-item
          [routerLink]="item.path"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: item.exact }"
        >
          {{ item.label }}
        </a>
      }
    </mat-menu>

    <span class="toolbar-spacer"></span>

    <div class="app-actions">
      <button
        mat-stroked-button
        type="button"
        class="language-toggle"
        (click)="toggleLanguage()"
        [attr.aria-label]="text().app.language.toggleLabel"
        [title]="
          language() === 'es'
            ? text().app.language.switchToEnglish
            : text().app.language.switchToSpanish
        "
      >
        {{ language().toUpperCase() }}
      </button>

      <button mat-flat-button type="button" class="logout-button" (click)="logout()">
        {{ text().app.logout }}
      </button>
    </div>
  </mat-toolbar>
} @else {
  <div class="public-language-action">
    <button
      mat-stroked-button
      type="button"
      class="language-toggle"
      (click)="toggleLanguage()"
      [attr.aria-label]="text().app.language.toggleLabel"
      [title]="
        language() === 'es'
          ? text().app.language.switchToEnglish
          : text().app.language.switchToSpanish
      "
    >
      {{ language().toUpperCase() }}
    </button>
  </div>
}

<main class="app-main" [class.public-main]="!authenticated()">
  <router-outlet></router-outlet>
</main>
