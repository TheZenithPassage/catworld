<section class="calendar-page">
  <header class="page-header">
    <div>
      <h2>Calendar</h2>
      <p>Monthly view of registered stays.</p>
    </div>

    <div class="header-actions">
      <a routerLink="/stays" class="secondary-action">
        View stays
      </a>

      <a routerLink="/stays/new" class="primary-action">
        Create stay
      </a>
    </div>
  </header>

  @if (loading()) {
    <p>Loading calendar...</p>
  } @else if (error()) {
    <div class="error-message">
      <p>{{ error() }}</p>
      <button type="button" (click)="loadStays()">Retry</button>
    </div>
  } @else {
    @if (stays().length === 0) {
      <p>No stays registered.</p>
    } @else {
      <p class="calendar-help">
        Select a calendar entry to open it in the stays list.
      </p>

      <div class="calendar-wrapper">
        <full-calendar
          [options]="calendarOptions"
          [events]="calendarEvents()"
        ></full-calendar>
      </div>
    }
  }
</section>
