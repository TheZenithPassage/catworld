<section class="stay-edit-page">
  <header class="page-header">
    <div>
      <h2>{{ text().stays.edit.title }}</h2>
      <p>{{ text().stays.edit.description }}</p>
    </div>
    <a mat-stroked-button routerLink="/stays" class="form-back-link">{{
      text().stays.edit.backToStays
    }}</a>
  </header>
  @if (loading()) {
    <app-ui-state kind="loading" [message]="text().stays.edit.loading" />
  } @else if (loadFailed()) {
    <app-ui-state
      kind="error"
      [message]="text().stays.edit.errors.loadFailed"
      [actionLabel]="text().entityDetail.retry"
      (actionTriggered)="load()"
    />
  } @else if (editorEntity(); as currentStay) {
    @if (paymentStay(); as currentPaymentStay) {
      @if (currentPaymentStay.agreedAmount !== null) {
        <app-stay-payments [stay]="currentPaymentStay" (stayChange)="onStayChanged($event)" />
      }
    }
    <app-stay-editor [entity]="currentStay" (saved)="saved()" />
  }
</section>
