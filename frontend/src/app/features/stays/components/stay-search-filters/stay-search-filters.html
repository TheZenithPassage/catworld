<div class="stay-search-filters" [attr.aria-label]="text().stays.filters.searchAriaLabel">
  <div class="search-filter">
    <app-remote-search-selector
      #catSelector
      [label]="text().stays.filters.cat"
      [placeholder]="text().stays.filters.searchCat"
      [lookup]="searchCats"
      [optionId]="catOptionId"
      [optionLabel]="catOptionLabel"
      [initialOption]="selectedCat()"
      (selectionChange)="selectCat($event)"
    ></app-remote-search-selector>
  </div>

  <div class="search-filter">
    <app-remote-search-selector
      #ownerSelector
      [label]="text().stays.filters.owner"
      [placeholder]="text().stays.filters.searchOwnerOrCats"
      [lookup]="searchOwners"
      [optionId]="ownerOptionId"
      [optionLabel]="ownerOptionLabel"
      [initialOption]="selectedOwner()"
      (selectionChange)="selectOwner($event)"
    ></app-remote-search-selector>
  </div>

  @if (hasSearchFilters()) {
    <div class="filter-actions">
      <button mat-stroked-button type="button" (click)="clearFilters()">
        {{ text().stays.filters.clear }}
      </button>
    </div>
  }
</div>
