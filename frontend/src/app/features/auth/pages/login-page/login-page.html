<section class="login-page">
  <header class="page-header">
    <span class="login-logo">
      <img src="/catworld-logo.png" [alt]="text().auth.login.logoAlt" />
    </span>
    <h2>{{ text().auth.login.title }}</h2>
    <p>{{ text().auth.login.description }}</p>
  </header>

  @if (error(); as errorMessage) {
    <app-ui-state kind="error" [message]="errorMessage"></app-ui-state>
  }

  <form class="login-form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline">
      <mat-label>{{ text().auth.login.username }}</mat-label>
      <input
        matInput
        type="text"
        name="username"
        autocomplete="username"
        required
        appTrimRequired
        [ngModel]="username()"
        (ngModelChange)="username.set($event)"
      />
      @if (usernameError(); as message) {
        <mat-error>{{ message }}</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>{{ text().auth.login.password }}</mat-label>
      <input
        matInput
        type="password"
        name="password"
        autocomplete="current-password"
        required
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
      />
      @if (passwordError(); as message) {
        <mat-error>{{ message }}</mat-error>
      }
    </mat-form-field>

    <div class="form-actions">
      <button mat-flat-button type="submit" [disabled]="submitting()">
        {{ submitting() ? text().auth.login.submitting : text().auth.login.submit }}
      </button>
    </div>
  </form>
</section>
