<section class="vet-create-page">
  <header class="page-header">
    <h2>{{ text().vets.create.title }}</h2>
    <p>{{ text().vets.create.description }}</p>
  </header>

  <form class="vet-form" (ngSubmit)="submit()">
    @if (error(); as errorMessage) {
      <app-ui-state kind="error" [message]="errorMessage"></app-ui-state>
    }

    <mat-form-field appearance="outline">
      <mat-label>{{ text().vets.form.name }}</mat-label>
      <input
        matInput
        type="text"
        name="name"
        required
        appTrimRequired
        [ngModel]="name()"
        (ngModelChange)="name.set($event)"
      />
      @if (nameError(); as message) {
        <mat-error>{{ message }}</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>{{ text().vets.form.address }}</mat-label>
      <input
        matInput
        type="text"
        name="address"
        [ngModel]="address()"
        (ngModelChange)="address.set($event)"
      />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>{{ text().vets.form.phoneNumber }}</mat-label>
      <input
        matInput
        type="text"
        name="phoneNumber"
        [ngModel]="phoneNumber()"
        (ngModelChange)="phoneNumber.set($event)"
      />
    </mat-form-field>

    <div class="form-actions">
      <button mat-flat-button type="submit" [disabled]="submitting()">
        {{ submitting() ? text().vets.create.submitting : text().vets.create.submit }}
      </button>
    </div>
  </form>
</section>
