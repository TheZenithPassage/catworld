<section class="vet-edit-page">
  <header class="page-header">
    <div>
      <h2>Edit vet</h2>
      <p>Update vet contact information.</p>
    </div>

    <a routerLink="/vets" class="secondary-action">Back to vets</a>
  </header>

  @if (loading()) {
    <p>Loading vet...</p>
  } @else {
    @if (error()) {
      <div class="error-message">
        <p>{{ error() }}</p>
      </div>
    }

    @if (vetLoaded()) {
      <form class="vet-form" (ngSubmit)="submit()">
        <label>
          Name
          <input
            type="text"
            name="name"
            [ngModel]="name()"
            (ngModelChange)="name.set($event)"
          />
        </label>

        <label>
          Address
          <input
            type="text"
            name="address"
            [ngModel]="address()"
            (ngModelChange)="address.set($event)"
          />
        </label>

        <label>
          Phone number
          <input
            type="text"
            name="phoneNumber"
            [ngModel]="phoneNumber()"
            (ngModelChange)="phoneNumber.set($event)"
          />
        </label>

        <div class="form-actions">
          <button type="submit" [disabled]="submitting()">
            {{ submitting() ? 'Saving...' : 'Save changes' }}
          </button>
        </div>
      </form>
    }
  }
</section>
