<div class="food-brand">
  <mat-form-field appearance="outline">
    <mat-label>{{ text().cats.form.foodBrand }}</mat-label>
    <input
      matInput
      type="text"
      name="foodBrand"
      maxlength="100"
      [ngModel]="foodBrand()"
      (ngModelChange)="changeFoodBrand($event)"
      (focus)="loadFoodBrands()"
      [matAutocomplete]="foodBrands"
    />
    <mat-autocomplete
      #foodBrands="matAutocomplete"
      (optionSelected)="selectFoodBrand($event.option.value)"
    >
      @for (brand of foodOptions(); track brand.id) {
        <mat-option [value]="brand.name">{{ brand.name }}</mat-option>
      }
    </mat-autocomplete>
  </mat-form-field>
  @if (canApproveFoodBrand()) {
    <mat-checkbox [checked]="approveFoodBrand()" (change)="approveFoodBrand.set($event.checked)">
      {{ text().cats.form.approveFoodBrand }}
    </mat-checkbox>
  }
</div>

<mat-form-field appearance="outline">
  <mat-label>{{ text().cats.form.foodDetail }}</mat-label>
  <input
    matInput
    type="text"
    name="foodDetail"
    maxlength="255"
    [ngModel]="foodDetail()"
    (ngModelChange)="foodDetail.set($event)"
  />
</mat-form-field>

<mat-form-field appearance="outline">
  <mat-label>{{ text().cats.form.litterBrand }}</mat-label>
  <input
    matInput
    type="text"
    name="litterBrand"
    maxlength="100"
    [ngModel]="litterBrand()"
    (ngModelChange)="litterBrand.set($event)"
    [matAutocomplete]="litterOptions"
  />
  <mat-autocomplete #litterOptions="matAutocomplete" [displayWith]="displayLitter">
    <mat-option [value]="sharedLitter">{{ text().cats.form.sharedLitter }}</mat-option>
  </mat-autocomplete>
</mat-form-field>
