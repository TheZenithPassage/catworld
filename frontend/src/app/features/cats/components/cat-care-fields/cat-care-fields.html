<mat-form-field appearance="outline">
  <mat-label>{{ text().cats.form.foodDetail }}</mat-label>
  <input
    matInput
    type="text"
    name="foodDetail"
    maxlength="255"
    [ngModel]="foodDetail()"
    (ngModelChange)="foodDetail.set($event)"
  />
  <mat-hint>{{ text().cats.form.foodDetailHelp }}</mat-hint>
</mat-form-field>

<mat-form-field appearance="outline">
  <mat-label>{{ text().cats.form.litterBrand }}</mat-label>
  <input
    matInput
    type="text"
    name="litterBrand"
    maxlength="100"
    [ngModel]="litterBrand()"
    (ngModelChange)="litterBrand.set($event)"
    [matAutocomplete]="litterOptions"
  />
  <mat-autocomplete #litterOptions="matAutocomplete" [displayWith]="displayLitter">
    <mat-option [value]="sharedLitter">{{ text().cats.form.sharedLitter }}</mat-option>
    <mat-option [value]="ownLitter">{{ text().cats.form.ownLitter }}</mat-option>
  </mat-autocomplete>
  <mat-hint>{{ text().cats.form.litterHelp }}</mat-hint>
</mat-form-field>
