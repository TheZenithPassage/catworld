<mat-card
  appearance="outlined"
  class="ui-state"
  [class.ui-state--empty]="kind === 'empty'"
  [class.ui-state--error]="kind === 'error'"
  [class.ui-state--loading]="kind === 'loading'"
  [attr.aria-live]="ariaLive"
  [attr.role]="role"
>
  <mat-card-content>
    @if (kind === 'loading') {
      <mat-progress-spinner mode="indeterminate" diameter="30"></mat-progress-spinner>
    } @else {
      <mat-icon aria-hidden="true">
        @if (kind === 'error') {
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z" />
            <path d="M12 7.5v5.5" />
            <path d="M12 16.5h.01" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16Z" />
            <path d="M12 10.5v5" />
            <path d="M12 8h.01" />
          </svg>
        }
      </mat-icon>
    }

    <p>{{ message }}</p>

    @if (actionLabel) {
      <button mat-stroked-button type="button" (click)="actionTriggered.emit()">
        {{ actionLabel }}
      </button>
    }
  </mat-card-content>
</mat-card>
