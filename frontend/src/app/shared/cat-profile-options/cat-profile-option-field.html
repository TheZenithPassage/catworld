<mat-form-field appearance="outline" [class.lookup-success]="optionId()">
  <mat-label>{{ label() }}</mat-label>
  <input
    #catalogInput
    matInput
    type="text"
    [name]="controlName() ?? field()"
    [maxlength]="field() === 'foodDetail' ? 255 : 100"
    [disabled]="disabled()"
    [ngModel]="value()"
    (ngModelChange)="changeValue($event)"
    [placeholder]="example()"
    (focus)="focused.set(true); loadOptions()"
    (blur)="focused.set(false)"
    [matAutocomplete]="approvedOptions"
  />
  <mat-autocomplete
    #approvedOptions="matAutocomplete"
    [displayWith]="displayName"
    (optionSelected)="select($event.option.value)"
  >
    @for (option of suggestions(); track option.id) {
      <mat-option [value]="option">{{ option.name }}</mat-option>
    }
  </mat-autocomplete>
  @if (value()) {
    <span matSuffix class="lookup-suffix">
      @if (optionId()) {
        <span class="lookup-status">
          <svg class="success-check" viewBox="0 0 24 24" focusable="false" aria-hidden="true">
            <path d="m5 12.5 4.2 4.2L19 7" />
          </svg>
        </span>
      }
      <button
        mat-icon-button
        type="button"
        class="clear-button"
        [attr.aria-label]="text().entityLookup.clear"
        [disabled]="disabled()"
        (click)="clear(catalogInput)"
      >
        <span class="clear-glyph" aria-hidden="true">×</span>
      </button>
    </span>
  }
</mat-form-field>
<span class="selection-announcement" role="status">
  {{ optionId() ? text().cats.form.catalogSelection(value()) : '' }}
</span>
@if (canPublish() || confirmingPublication()) {
  <button
    mat-stroked-button
    type="button"
    class="publish-option"
    [disabled]="confirmingPublication()"
    (click)="publish()"
  >
    {{ text().cats.form.publishOption(value().trim(), catalogName()) }}
  </button>
}
