server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/public-site;
    index index.html;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    location = /api/public-gallery {
        limit_except GET { deny all; }
        proxy_hide_header Cache-Control;
        proxy_pass http://app:8080;
    }

    location ~ "^/api/public-gallery/[0-9a-fA-F-]{36}/photo$" {
        limit_except GET { deny all; }
        proxy_hide_header Cache-Control;
        proxy_pass http://app:8080;
    }

    location /api/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
