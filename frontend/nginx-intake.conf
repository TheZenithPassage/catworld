server {
    listen 8082;
    server_name _;
    root /usr/share/nginx/intake-site;
    index index.html;
    client_max_body_size 33m;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    location = /api/intake/request {
        limit_except GET { deny all; }
        proxy_hide_header Cache-Control;
        proxy_pass http://app:8080;
    }

    location = /api/intake/submissions {
        limit_except POST { deny all; }
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_hide_header Cache-Control;
        proxy_pass http://app:8080;
    }

    location /api/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
