name: catworld-demo

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: catworld_demo
      MYSQL_USER: catworld_demo
      MYSQL_PASSWORD: ${CATWORLD_DEMO_DB_PASSWORD:?Demo database password is required}
      MYSQL_ROOT_PASSWORD: ${CATWORLD_DEMO_DB_ROOT_PASSWORD:?Demo database administrator password is required}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -e 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    image: catworld-demo-backend:${CATWORLD_DEMO_REVISION:?Demo image revision is required}
    pull_policy: never
    stop_grace_period: 45s
    environment:
      SPRING_PROFILES_ACTIVE: docker,demo
      BUSINESS_TIME_ZONE: America/Argentina/Buenos_Aires
      DB_HOST: db
      DB_NAME: catworld_demo
      DB_USER: catworld_demo
      DB_PASSWORD: ${CATWORLD_DEMO_DB_PASSWORD:?Demo database password is required}
      CATWORLD_DEMO_MODE: "true"
      CATWORLD_SECURITY_USERNAME: demo
      CATWORLD_SECURITY_PASSWORD: ${CATWORLD_DEMO_APP_PASSWORD:?Demo service credential is required}
      CATWORLD_SECURITY_CORS_ALLOWED_ORIGINS: https://test.catworld.com.ar,http://127.0.0.1:4210
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data
      - api

  frontend:
    image: catworld-demo-frontend:${CATWORLD_DEMO_REVISION:?Demo image revision is required}
    pull_policy: never
    ports:
      - "127.0.0.1:4210:80"
    environment:
      BUSINESS_TIME_ZONE: America/Argentina/Buenos_Aires
      CATWORLD_DEMO_MODE: "true"
      CATWORLD_DEMO_BASIC: ${CATWORLD_DEMO_BASIC:?Demo service credential is required}
    depends_on:
      - app
    networks:
      - api
      - ingress

  tunnel:
    image: cloudflare/cloudflared:2026.11.2
    profiles: ["public"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CATWORLD_DEMO_TUNNEL_TOKEN:-}
    networks:
      - ingress

networks:
  api:
    internal: true
  data:
    internal: true
  ingress:

volumes:
  mysql_data:
